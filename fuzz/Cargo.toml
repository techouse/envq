[package]
name = "envq-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
envq = { path = "..", features = ["fuzzing"] }
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[workspace]
members = ["."]

[[bin]]
name = "parse_roundtrip"
path = "fuzz_targets/parse_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_set_unset"
path = "fuzz_targets/edit_set_unset.rs"
test = false
doc = false
bench = false

[[bin]]
name = "list_output"
path = "fuzz_targets/list_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff"
path = "fuzz_targets/diff.rs"
test = false
doc = false
bench = false

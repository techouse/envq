[package]
authors = ["Klemen Tusar <techouse@gmail.com>"]
name = "envq"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/techouse/envq"
homepage = "https://techouse.github.io/envq/"
description = "Byte-preserving .env query and editing tool"
keywords = ["env", "dotenv", "cli", "configuration", "parser"]
exclude = [
    ".github/",
    ".gitignore",
    ".history/",
    ".vscode/**",
    "AGENTS.md",
    "CODE-OF-CONDUCT.md",
    "fuzz/**",
    "Makefile",
    "scripts/**",
    "src/**/tests.rs",
    "src/**/tests/**",
    "SECURITY.md",
    "tests/**",
]

[features]
default = []
fuzzing = []

[[bin]]
name = "envq"
path = "src/main.rs"

[dependencies]
clap = "4.6.1"
clap_complete = "4.6.1"
imara-diff = { version = "0.2", default-features = false }
tempfile = "3"

[dev-dependencies]
serde_json = "1"

[package.metadata.deb]
maintainer = "Klemen Tusar <techouse@gmail.com>"
copyright = "2026, Klemen Tusar <techouse@gmail.com>"
depends = "$auto"
extended-description = """
envq is a byte-preserving .env query and editing tool. It preserves comments,
spacing, duplicate-key semantics, line endings, and invalid UTF-8 bytes while
performing targeted edits.
"""
section = "utils"
priority = "optional"
assets = [
    ["target/release/envq", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/envq/README.md", "644"],
    ["LICENSE", "usr/share/doc/envq/LICENSE", "644"],
    [
        "THIRD-PARTY-LICENSES.md",
        "usr/share/doc/envq/THIRD-PARTY-LICENSES.md",
        "644",
    ],
    [
        "target/completions/envq.bash",
        "usr/share/bash-completion/completions/envq",
        "644",
    ],
    [
        "target/completions/_envq",
        "usr/share/zsh/vendor-completions/_envq",
        "644",
    ],
    [
        "target/completions/envq.fish",
        "usr/share/fish/vendor_completions.d/envq.fish",
        "644",
    ],
]

[package.metadata.generate-rpm]
release = "1"

[[package.metadata.generate-rpm.assets]]
source = "target/release/envq"
dest = "/usr/bin/envq"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "README.md"
dest = "/usr/share/doc/envq/README.md"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/doc/envq/LICENSE"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "THIRD-PARTY-LICENSES.md"
dest = "/usr/share/doc/envq/THIRD-PARTY-LICENSES.md"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "target/completions/envq.bash"
dest = "/usr/share/bash-completion/completions/envq"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "target/completions/_envq"
dest = "/usr/share/zsh/vendor-completions/_envq"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "target/completions/envq.fish"
dest = "/usr/share/fish/vendor_completions.d/envq.fish"
mode = "0644"

[profile.release]
strip = "symbols"
